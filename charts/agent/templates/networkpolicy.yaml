{{- if .Values.networkPolicy.enabled }}
# Default-deny cross-agent traffic. Works with any CNI (plain networking.k8s.io policy).
# See the warning in values.yaml: egress here does not include the observability namespace
# or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-agent
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
