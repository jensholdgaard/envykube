apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/ksm:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 30s
              static_configs:
                - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]

    processors:
      batch:

    exporters:
      otlp/tempo:
        endpoint: tempo.{{ .Release.Namespace }}.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/mimir:
        endpoint: http://mimir.{{ .Release.Namespace }}.svc.cluster.local:8080/otlp
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki.{{ .Release.Namespace }}.svc.cluster.local:3100/otlp
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp, prometheus/ksm]
          processors: [batch]
          exporters: [otlphttp/mimir]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image }}
          args:
            - --config=/etc/otel-collector/config.yaml
          ports:
            - name: grpc-otlp
              containerPort: 4317
              protocol: TCP
            - name: http-otlp
              containerPort: 4318
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
      nodePort: {{ .Values.otelCollector.grpcNodePort }}
      protocol: TCP
    - name: http-otlp
      port: 4318
      targetPort: 4318
      nodePort: {{ .Values.otelCollector.httpNodePort }}
      protocol: TCP
