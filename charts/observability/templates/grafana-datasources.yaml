# Loaded by the Grafana chart's datasource sidecar (label grafana_datasource=1).
# Requires sidecar.datasources.enabled=true — set in values/grafana.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir.{{ .Release.Namespace }}.svc.cluster.local:8080/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.{{ .Release.Namespace }}.svc.cluster.local:3200
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.{{ .Release.Namespace }}.svc.cluster.local
