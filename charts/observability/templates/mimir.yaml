# Grafana Mimir — MONOLITHIC (-target=all), single replica, filesystem storage, multitenancy OFF.
# One deployment, no metrics-storage pod sprawl.
# multitenancy_enabled:false is REQUIRED — otherwise every push is rejected for a missing
# X-Scope-OrgID header (all data lands under the implicit "anonymous" tenant instead).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: {{ .Release.Namespace }}
data:
  mimir.yaml: |
    multitenancy_enabled: false
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info
    common:
      storage:
        backend: filesystem
    limits:
      # Lift these OTel resource attributes into Prometheus labels so metrics can be filtered
      # by service/namespace/pod in Grafana. Must be a COMMA-SEPARATED STRING, not a YAML list:
      # Mimir parses this as flagext.StringSliceCSV, and a sequence here fails at startup with
      # `cannot unmarshal !!seq into string` (crash-loops the whole metrics store).
      promote_otel_resource_attributes: "service.name,service.namespace,service.version,k8s.namespace.name,k8s.pod.name,deployment.environment"
    blocks_storage:
      filesystem:
        dir: /data/blocks
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore: { store: memberlist }
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore: { store: memberlist }
    ingester:
      ring:
        instance_addr: 127.0.0.1
        replication_factor: 1
        kvstore: { store: memberlist }
    store_gateway:
      sharding_ring:
        replication_factor: 1
    ruler_storage:
      filesystem:
        dir: /data/ruler
    alertmanager_storage:
      filesystem:
        dir: /data/alertmanager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.mimir.storage }}
  # k3d ships local-path as the default StorageClass; leave storageClassName unset to use it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: {{ .Values.mimir.image }}
          args: ["-config.file=/etc/mimir/mimir.yaml", "-target=all"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9095 }
          volumeMounts:
            - { name: config, mountPath: /etc/mimir }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: mimir-config }
        - name: data
          persistentVolumeClaim: { claimName: mimir-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mimir
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 9095, targetPort: 9095 }
